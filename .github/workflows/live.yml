# Live provider tests — runs the test suite against the REAL Groq API.
#
# This workflow is manual-only. It does not run on every push or PR because
# it costs real API quota and depends on a third-party service being up; a
# failure here means "Groq changed something" or "quota exhausted", not "this
# PR is broken", so it must never block normal development.
#
# One-time setup (do this before the first run):
#
#   1. Add the API key as a repository secret:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  GROQ_API_KEY
#      Value: <your Groq API key>
#
#   2. Create the "live-tests" GitHub Environment (used to gate the secret):
#      Settings -> Environments -> New environment -> name it "live-tests"
#      Optionally add yourself as a required reviewer under
#      "Deployment protection rules" so every run needs a manual approval
#      before the secret is exposed.
#
#   3. Add GROQ_API_KEY to the "live-tests" environment's secrets (Environment
#      secrets take precedence over/are separate from repository secrets, and
#      scoping it to the environment is what lets the reviewer gate apply).
#
#   4. (Optional) Add OPENROUTER_API_KEY to the same "live-tests" environment
#      to also run tests/test_live_openrouter.py against the real OpenRouter
#      API. This secret is not required: every OpenRouter live test carries
#      its own skipif on OPENROUTER_API_KEY being unset, so the file is a
#      clean, all-skipped no-op without it, and the pass-count floor below
#      already accounts for that (see docs/LIVE_TESTING.md for cost and setup
#      details).
#
#   5. To trigger a run: go to the "Actions" tab -> "Live provider tests"
#      (this workflow) in the left sidebar -> "Run workflow" button -> pick
#      the branch -> "Run workflow".
#
# Schedule decision: in addition to workflow_dispatch, this workflow also
# runs weekly (Mondays 06:00 UTC) as a low-traffic canary for upstream API
# drift (Groq changing response shapes, deprecating models, etc.). A single
# weekly run against a free-tier key is cheap enough not to be a quota
# concern, and catching drift within a week beats discovering it only when a
# human happens to run this by hand. If that trade-off stops making sense
# (quota pressure, noisy failures), delete the `schedule:` block below and
# keep workflow_dispatch only.
#
# Missing-secret behaviour: if GROQ_API_KEY has not been configured yet, the
# live tests skip themselves (they check for the env var and self-skip). This
# job deliberately does NOT let that pass as green, though: a run where every
# live test self-skipped never actually exercised the real Groq API, so a
# green badge in that state would be pure false assurance -- indistinguishable
# from the outside from a run where the tests genuinely passed. The
# "Check live test results actually ran" step below parses the JUnit XML
# pytest writes and fails the job with a clear message if fewer than the
# expected number of live tests actually PASSED (as opposed to having been
# skipped) -- see that step for the exact floor and reasoning. So: red here
# now means either a real test failure/error, or GROQ_API_KEY missing/wrong --
# both are things a maintainer with repo-secret access needs to act on, which
# is exactly who is expected to run this manual/scheduled workflow.
#
# Security note: `pull_request_target` is intentionally never used here. That
# trigger runs workflow code from the base branch but checks out and can be
# steered by a fork's PR content, which would let an attacker exfiltrate
# GROQ_API_KEY or OPENROUTER_API_KEY through a malicious PR. This workflow
# only ever runs on workflow_dispatch (and the fixed weekly schedule above),
# both of which use the trusted default branch and require repo-write access
# to trigger.

name: Live provider tests

on:
  workflow_dispatch: {}
  schedule:
    # Mondays at 06:00 UTC — see "Schedule decision" comment above.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  live:
    name: live (groq + openrouter)
    runs-on: ubuntu-latest
    environment: live-tests
    # Guards against a hung network call burning Actions minutes; the whole
    # live suite should finish in well under this on a healthy API.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # GROQ_API_KEY and OPENROUTER_API_KEY are scoped to this step only (not
      # the job or workflow), and neither is ever echoed, dumped via `env`,
      # or exposed via `set -x`. OPENROUTER_API_KEY is optional: if the
      # "live-tests" environment doesn't have it configured, this resolves
      # to an empty string, and every test in tests/test_live_openrouter.py
      # self-skips via its own skipif -- it does not fail the job.
      #
      # This step intentionally does not fail the job by itself on a non-zero
      # pytest exit -- the exit code is captured into $GITHUB_ENV and checked
      # explicitly by the next step, alongside the JUnit XML pass/skip
      # counts, so both "a live test actually failed" and "every live test
      # quietly self-skipped" are reported with one clear message instead of
      # pytest's default (and, for the all-skipped case, misleadingly green)
      # exit status.
      - name: Run live tests against the real Groq and OpenRouter APIs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          pytest -m live -q --junit-xml=live-results.xml
          echo "PYTEST_EXIT_CODE=$?" >> "$GITHUB_ENV"

      # Guards against the exact failure mode this workflow exists to catch:
      # a green run that verified nothing because GROQ_API_KEY was never
      # configured (or was configured wrong) and every live test
      # self-skipped. pytest alone can't surface that -- "all skipped" is a
      # clean exit 0 -- so this step parses the JUnit XML from the step above
      # and asserts a minimum number of tests actually PASSED (not skipped).
      #
      # The floor is 5, not 6: tests/test_live_groq.py currently defines 6
      # tests under @pytest.mark.live, and exactly one of them
      # (test_real_429_with_retry_after) is a *permanent*, intentional skip
      # -- it deliberately does not attempt to provoke a real 429, to avoid
      # burning Groq quota (see that test's own docstring and
      # docs/LIVE_TESTING.md). So "every live test genuinely ran" looks like
      # 5 passed + 1 skipped, never 6 passed. If tests/test_live_groq.py
      # gains or loses live tests, update MIN_LIVE_PASSED to match.
      #
      # This floor is deliberately based on Groq alone, so it holds whether
      # or not OPENROUTER_API_KEY is configured. Without it,
      # tests/test_live_openrouter.py's tests all self-skip via their own
      # skipif and contribute 0 to `passed` -- Groq's 5 still clear the
      # floor. With it, OpenRouter's tests add their own passes on top,
      # which only raises `passed` further and never breaks the check.
      #
      # This step never prints GROQ_API_KEY or any other secret -- only test
      # names and pass/fail/skip counts read back from the JUnit XML.
      - name: Check live test results actually ran
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          MIN_LIVE_PASSED = 5  # see comment on the step above

          try:
              root = ET.parse("live-results.xml").getroot()
          except FileNotFoundError:
              print(
                  "::error::live-results.xml was not produced -- pytest did not "
                  "run to completion. Check the previous step's log."
              )
              sys.exit(1)

          suites = root.findall(".//testsuite") if root.tag != "testsuite" else [root]

          total = passed = skipped = failed = errored = 0
          skipped_names = []
          for suite in suites:
              for case in suite.findall("testcase"):
                  total += 1
                  if case.find("skipped") is not None:
                      skipped += 1
                      skipped_names.append(case.get("name", "?"))
                  elif case.find("failure") is not None:
                      failed += 1
                  elif case.find("error") is not None:
                      errored += 1
                  else:
                      passed += 1

          print("== Live test summary ==")
          print(
              f"total={total} passed={passed} skipped={skipped} "
              f"failed={failed} errored={errored} "
              f"(floor: {MIN_LIVE_PASSED} passed)"
          )
          if skipped_names:
              print(f"skipped: {', '.join(skipped_names)}")

          pytest_exit_code = os.environ.get("PYTEST_EXIT_CODE", "1")
          problems = []

          if pytest_exit_code != "0":
              problems.append(
                  f"pytest exited with status {pytest_exit_code} -- one or "
                  "more live tests failed or errored."
              )

          if passed < MIN_LIVE_PASSED:
              problems.append(
                  f"only {passed} live test(s) actually passed (need at "
                  f"least {MIN_LIVE_PASSED}) -- live tests were skipped. Is "
                  "the GROQ_API_KEY secret configured for the 'live-tests' "
                  "environment? A green run must mean the tests actually "
                  "executed against the real Groq API, not that they "
                  "self-skipped."
              )

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("Live tests genuinely ran against the real Groq API. OK.")
          PY
