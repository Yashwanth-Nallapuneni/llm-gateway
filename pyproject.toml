[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiollm-gateway"
version = "0.1.0"
description = "Rate-limited, batching, failover-capable async client layer for LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashwanth Sai Nallapuneni", email = "yashwanthgrad@gmail.com" }]
keywords = [
    "llm", "asyncio", "rate-limiting", "token-bucket", "retry", "backoff",
    "circuit-breaker", "batching", "openrouter", "groq", "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Yashwanth-Nallapuneni/llm-gateway"
Repository = "https://github.com/Yashwanth-Nallapuneni/llm-gateway"
Issues = "https://github.com/Yashwanth-Nallapuneni/llm-gateway/issues"

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits a real provider API; requires an API key. Skipped by default.",
]
# Live tests never run unless explicitly asked for: `pytest -m live`.
addopts = "-m 'not live'"

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    # The four annotated core modules carry long explanatory comments by design.
    "E501",
]

[tool.mypy]
python_version = "3.11"
files = ["src/llm_gateway"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests exercise private helpers and monkeypatch freely; strict mode there
# would produce noise without catching real bugs in the library itself.
module = "tests.*"
ignore_errors = true
